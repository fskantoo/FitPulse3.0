name: Build FitPulse IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          chmod +x ./build-unsigned-ipa.sh
          ./build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FitPulse-unsigned-ipa
          path: FitPulse-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
