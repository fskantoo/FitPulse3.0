workflows:
  ios-workflow:
    name: FitPulse iOS Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build ipa for testing
        script: |
          # Comando di build nativo per Xcode
          xcodebuild -project FitPulse.xcodeproj -scheme FitPulse -sdk iphoneos -configuration Release archive -archivePath build/FitPulse.xcarchive
          xcodebuild -exportArchive -archivePath build/FitPulse.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/ios
    artifacts:
      - build/ios/*.ipa